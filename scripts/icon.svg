<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6b45"/>
      <stop offset="1" stop-color="#244a2e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <g transform="translate(512,540) scale(8.6) translate(-100,-60)">
    <!-- ears -->
    <circle cx="66" cy="70" r="7" fill="#e8b48c"/>
    <circle cx="134" cy="70" r="7" fill="#e8b48c"/>
    <!-- face -->
    <path d="M68 58 Q68 34 100 34 Q132 34 132 58 L132 74 Q132 100 100 104 Q68 100 68 74 Z" fill="#e8b48c"/>
    <!-- beard -->
    <path d="M70 70 Q72 104 100 106 Q128 104 130 70 Q124 88 100 90 Q76 88 70 70 Z" fill="#3b2a22"/>
    <!-- cheeks -->
    <ellipse cx="78" cy="78" rx="6" ry="4" fill="#f0a6a0" opacity=".5"/>
    <ellipse cx="122" cy="78" rx="6" ry="4" fill="#f0a6a0" opacity=".5"/>
    <!-- eyebrows -->
    <path d="M74 58 Q82 54 90 57" stroke="#3b2a22" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M110 57 Q118 54 126 58" stroke="#3b2a22" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="84" cy="66" r="7.5" fill="#fff"/><circle cx="84" cy="67" r="3.4" fill="#2b2015"/><circle cx="85.4" cy="65.6" r="1.1" fill="#fff"/>
    <circle cx="116" cy="66" r="7.5" fill="#fff"/><circle cx="116" cy="67" r="3.4" fill="#2b2015"/><circle cx="117.4" cy="65.6" r="1.1" fill="#fff"/>
    <!-- round glasses -->
    <g fill="none" stroke="#c9a24a" stroke-width="2.2">
      <circle cx="84" cy="66" r="11"/><circle cx="116" cy="66" r="11"/>
      <path d="M95 66 h10"/><path d="M73 64 l-6 -3"/><path d="M127 64 l6 -3"/>
    </g>
    <!-- nose -->
    <path d="M100 68 q-3 8 -4 12 q4 3 8 0" fill="none" stroke="#c98a63" stroke-width="2" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M90 90 Q100 97 110 90" fill="none" stroke="#7a3b2e" stroke-width="2.4" stroke-linecap="round"/>
    <!-- fedora -->
    <ellipse cx="100" cy="40" rx="52" ry="11" fill="#1c1c22"/>
    <path d="M68 42 Q66 14 100 14 Q134 14 132 42 Q116 34 100 34 Q84 34 68 42 Z" fill="#23232b"/>
    <path d="M70 40 Q100 30 130 40 L128 44 Q100 36 72 44 Z" fill="#141418"/>
